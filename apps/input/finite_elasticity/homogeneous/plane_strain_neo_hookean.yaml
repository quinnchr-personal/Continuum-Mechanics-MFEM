# Homogeneous plane-strain extension to lambda = 2.0, incompressible neo-Hookean (mu = 1),
# mixed u-p formulation (Taylor-Hood Q2-Q1) on the unit square. The affine
# displacement u = ((lambda - 1) X, (1/lambda - 1) Y) is prescribed on the end
# faces X = 0 (left) and X = 1 (right); the faces Y = 0, 1 are free. The
# exact solution is that affine field with constant pressure p = tr(sigma)/3,
# sigma_11 and sigma_33 from doc/incompressible_hyperelasticity.tex, Sec. 5.1;
# apps/homogeneous_compare.py checks the probed fields against it.
formulation: mixed
mesh:
  file: apps/mesh/square.msh      # unit square, 4 x 4 quadrilaterals; physical groups bottom, right, top, left
  order: 2
material: { model: iso_neo_hookean, mu: 1.0, incompressible: true }
bcs:
  dirichlet:
    - { attr: [left, right], expression: ["x", "-0.5*y"] }
solver:
  load_steps: 8
  newton: { rtol: 1e-11, atol: 1e-13, max_it: 30 }
  linear: { type: gmres_amg, rtol: 1e-13, max_it: 400, krylov_dim: 100, inner_rtol: 1e-4, inner_max_it: 100 }
output:
  paraview: out/homogeneous/plane_strain_neo_hookean
  fields: [displacement, pressure, vonmises, jacobian, cauchy_stress, pk1_stress]
  quadrature_at: [nodes, elements, quadrature_points]   # <name> nodal, <name>_elem element average, <name>_qp point cloud
  nodal_projection: averaged                            # or projected (global L2 projection)
  probes:
    - { name: corner, point: [1.0, 1.0] }
    - { name: center, point: [0.5, 0.5] }
