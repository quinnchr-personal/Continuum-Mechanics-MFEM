# Homogeneous uniaxial tension of a thin sheet to lambda = 2.0, incompressible Yeoh (c10 = 0.5, c20 = -0.05, c30 = 0.01, mu = 1),
# plane stress (plane: stress, displacement formulation): the thickness stretch
# lambda3 = 1/det F2D and the mean stress p = -sigma'_33 are eliminated pointwise,
# so no pressure unknown is needed. The affine displacement
# u = ((lambda - 1) X, (lambda^-1/2 - 1) Y) is prescribed on the end faces X = 0
# (left) and X = 1 (right); the faces Y = 0, 1 are free. Exact solution:
# sigma_11 = 2 (lambda^2 - 1/lambda) (Psi_1 + Psi_2/lambda), every other stress
# zero, thickness stretch lambda^-1/2 (doc/incompressible_hyperelasticity.tex,
# Sec. 4.1 and 5.3); apps/homogeneous_compare.py checks the probed fields.
plane: stress
mesh:
  file: apps/mesh/square.msh      # unit square, 4 x 4 quadrilaterals; physical groups bottom, right, top, left
  order: 2
material: { model: yeoh, c10: 0.5, c20: -0.05, c30: 0.01, incompressible: true }
bcs:
  dirichlet:
    - { attr: [left, right], expression: ["x", "-0.2928932188134525*y"] }
solver:
  load_steps: 8
  newton: { rtol: 1e-11, atol: 1e-13, max_it: 30 }
  linear: { type: gmres_amg, rtol: 1e-13, max_it: 400, krylov_dim: 100 }
output:
  paraview: out/homogeneous/plane_stress_yeoh
  fields: [displacement, vonmises, jacobian, thickness_stretch, cauchy_stress, pk1_stress]
  quadrature_at: [nodes, elements, quadrature_points]   # <name> nodal, <name>_elem element average, <name>_qp point cloud
  nodal_projection: averaged                            # or projected (global L2 projection)
  probes:
    - { name: corner, point: [1.0, 1.0] }
    - { name: center, point: [0.5, 0.5] }
