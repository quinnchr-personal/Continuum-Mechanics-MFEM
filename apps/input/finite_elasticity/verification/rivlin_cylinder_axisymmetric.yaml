# The thick-walled cylinder of rivlin_cylinder_inflation.yaml (A = 1, B = 2, incompressible
# neo-Hookean, mu = 1, internal follower pressure P = 0.3) as an axisymmetric analysis
# (plane: axisymmetric, x = r, y = z): the meridian strip A <= r <= B, 0 <= z <= 0.5 of
# apps/mesh/strip.geo, 16 x 2 Q2-Q1 quadrilaterals, with rollers on both z faces (plane strain),
# so that the solution is Rivlin's: a = 1.28158, b = 2.15463 at P = 0.3 (see the plane-strain
# input for the closed form). The hoop stretch (r + u_r)/r and the weight 2 pi r make the
# reaction of the roller faces the total axial force of the tube. tests/test_axisymmetric.cpp
# checks the probes against the closed form.
formulation: mixed
plane: axisymmetric
mesh: { file: apps/mesh/strip.msh, order: 2 }   # bottom (z = 0) 1, outer (r = 2) 2, top (z = 0.5) 3, inner (r = 1) 4
material: { model: iso_neo_hookean, mu: 1.0, incompressible: true }
bcs:
  dirichlet:
    - { attr: [bottom], name: bottom, expression: ["0", "0"], components: [y] }
    - { attr: [top], name: top, expression: ["0", "0"], components: [y] }
  traction:
    - { attr: [inner], type: follower_pressure, expression: "0.3" }
solver:
  load_steps: 6
  newton: { rtol: 1e-10, atol: 1e-12, max_it: 30 }
  linear: { type: direct }
output:
  paraview: out/rivlin_cylinder_axisymmetric
  fields: [displacement, pressure, vonmises, jacobian, cauchy_stress]
  reactions: true
  probes:
    - { name: inner, point: [1.0, 0.25] }
    - { name: outer, point: [2.0, 0.25] }
