# 3D cantilever in the small-load linear limit: L = 10, square section 1 x 1,
# clamped at x = 0 (left), downward shear traction on the x = L face
# (right). The load gives max |Grad u| ~ 5e-5 (tests/test_benchmarks checks
# <= 1e-4); Euler-Bernoulli tip deflection P L^3 / (3 E I) = 3.2e-4.
# The rigid-body-mode (elasticity) AMG options stall on this slender p = 2
# hex mesh, so the plain systems options are selected here; the solver also
# falls back to them automatically if the elasticity variant does not converge.
mesh:
  file: apps/mesh/beam.msh        # 10 x 1 x 1 beam, 20 x 2 x 2 hexahedra (apps/mesh/box.geo); groups bottom, front, right, back, left, top
  serial_refine: 0
  parallel_refine: 0
  order: 2
material: { model: neo_hookean, E: 250.0, nu: 0.3, rho0: 1.0 }
bcs:
  dirichlet: [ { attr: [left], expression: ["0", "0", "0"] } ]
  traction:  [ { attr: [right], expression: ["0", "0", "-2e-05"] } ]
solver:
  load_steps: 1
  # rtol 1e-6 of the 5e-6 initial residual is ~10x above the round-off floor
  # of the stress evaluation at these strains (eps * mu per point).
  newton: { rtol: 1e-6, atol: 1e-14, max_it: 25 }
  linear: { type: gmres_amg, amg: systems, rtol: 1e-12, max_it: 500 }
output:
  paraview: out/euler_bernoulli_cantilever3d
  fields: [displacement, vonmises, jacobian]
  probes: [ { name: tip, point: [10.0, 0.5, 0.5] } ]
