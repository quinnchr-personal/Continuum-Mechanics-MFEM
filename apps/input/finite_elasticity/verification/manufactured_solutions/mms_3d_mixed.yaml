# Manufactured solution of the mixed u-p formulation on the unit cube
# (tests/test_verification.cpp): isochoric neo-Hookean with kappa = 400 (mu = 40,
# rho0 = 2.5) and the isochoric exact displacement u = 0.05 (sin(pi y) sin(pi z), z (1 - z), 0)
# whose gradient is strictly upper triangular, so J = 1 exactly and the exact pressure
# kappa (J - 1) vanishes; the body force b = -(1/rho0) Div P_iso(F(u)) is generated by
# sympy (four increments: with the exact boundary data applied in one increment and the
# interior still at rest, elements next to the boundary invert on fine meshes). The same
# field also runs in the displacement formulation (penalty volumetric
# law, identical P at J = 1). Hexahedra; third-order L2 convergence for p = 2.
formulation: mixed
mesh: { file: apps/mesh/cube.msh, serial_refine: 1, order: 2 }
material: { model: iso_neo_hookean, mu: 40.0, kappa: 400.0, rho0: 2.5 }
bcs:
  dirichlet:
    - { attr: [bottom, front, right, back, left, top], expression: ["(1.0/20.0)*sin(pi*y)*sin(pi*z)", "(1.0/20.0)*z*(1 - z)", "0"] }
body_force:
  expression:
    - "(8.0/5.0)*pow(pi, 2)*sin(pi*y)*sin(pi*z)"
    - "-2.0/75.0*pow(pi, 3)*sin(pi*y)*pow(sin(pi*z), 2)*cos(pi*y) + (2.0/75.0)*pow(pi, 3)*sin(pi*y)*cos(pi*y)*pow(cos(pi*z), 2) + 8.0/5.0"
    - "-1.0/375.0*pow(pi, 3)*z*sin(pi*y)*pow(sin(pi*z), 2)*cos(pi*y) + (1.0/375.0)*pow(pi, 3)*z*sin(pi*y)*cos(pi*y)*pow(cos(pi*z), 2) + (8.0/75.0)*z - 2.0/75.0*pow(pi, 3)*pow(sin(pi*y), 2)*sin(pi*z)*cos(pi*z) + (1.0/750.0)*pow(pi, 3)*sin(pi*y)*pow(sin(pi*z), 2)*cos(pi*y) - 1.0/750.0*pow(pi, 3)*sin(pi*y)*cos(pi*y)*pow(cos(pi*z), 2) + (2.0/75.0)*pow(pi, 3)*sin(pi*z)*pow(cos(pi*y), 2)*cos(pi*z) - 4.0/75.0"
solver:
  load_steps: 4                    # the exact boundary data applied at once inverts boundary elements on fine meshes
  newton: { rtol: 1e-11, atol: 1e-14, max_it: 25, print_level: 0 }
  linear: { type: gmres_amg, rtol: 1e-13, max_it: 1000, krylov_dim: 100, inner_rtol: 1e-5, inner_max_it: 200 }
