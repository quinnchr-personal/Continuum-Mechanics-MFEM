# Manufactured solution driven entirely by YAML expressions (tests/test_loading.cpp; the 3D cases in tests/test_verification.cpp):
# plane strain, St. Venant-Kirchhoff (E = 250, nu = 0.3, rho0 = 2.5) on the unit
# square, exact displacement u = 0.05 (sin(pi x) sin(pi y), x^2 y (1 - y)) prescribed
# on the whole boundary, body force b = -(1/rho0) Div P(F(u)) generated with sympy
# (expression strings; the parser's pow and pi). Convergence rate checked under
# serial_refine 1, 2, 3.
mesh: { file: apps/mesh/square.msh, serial_refine: 1, order: 2 }
material: { model: st_venant_kirchhoff, E: 250.0, nu: 0.3, rho0: 2.5 }
bcs:
  dirichlet:
    - { attr: [bottom, right, top, left], expression: ["0.05*sin(pi*x)*sin(pi*y)", "0.05*x^2*y*(1 - y)"] }
body_force:
  expression:
    - "-1.0/832.0*(pi*sin(pi*y)*cos(pi*x) + 20)*(48*pow(x, 3)*pow(y, 2) - 48*pow(x, 3)*y + 8*pow(x, 3) - 320*x*y + 160*x + pow(pi, 3)*sin(pi*(2*x - 2*y)) + pow(pi, 3)*sin(pi*(2*x + 2*y)) - 40*pow(pi, 2)*cos(pi*(x - y)) + 40*pow(pi, 2)*cos(pi*(x + y))) - 1.0/1664.0*(pi*sin(pi*y)*cos(pi*x) + 20)*(96*pow(x, 3)*pow(y, 2) - 96*pow(x, 3)*y + 24*pow(x, 3) + 112*x*pow(y, 4) - 224*x*pow(y, 3) + 112*x*pow(y, 2) - 960*x*y + 480*x - 4*pow(pi, 3)*sin(2*pi*x) + 5*pow(pi, 3)*sin(pi*(2*x - 2*y)) + 5*pow(pi, 3)*sin(pi*(2*x + 2*y)) - 280*pow(pi, 2)*cos(pi*(x - y)) + 280*pow(pi, 2)*cos(pi*(x + y))) - 1.0/104.0*pow(pi, 2)*(2*x*y*(y - 1)*(pow(x, 2)*y + pow(x, 2)*(y - 1) - 20) + pi*(pi*sin(pi*y)*cos(pi*x) + 20)*sin(pi*x)*cos(pi*y))*cos(pi*x)*cos(pi*y) + (1.0/832.0)*pow(pi, 2)*(12*pow(x, 2)*pow(y, 2)*pow(y - 1, 2) + 3*pow(pi*sin(pi*y)*cos(pi*x) + 20, 2) + 7*pow(pow(x, 2)*y + pow(x, 2)*(y - 1) - 20, 2) + 7*pow(pi, 2)*pow(sin(pi*x), 2)*pow(cos(pi*y), 2) - 4000)*sin(pi*x)*sin(pi*y) + (1.0/832.0)*pow(pi, 2)*(28*pow(x, 2)*pow(y, 2)*pow(y - 1, 2) + 7*pow(pi*sin(pi*y)*cos(pi*x) + 20, 2) + 3*pow(pow(x, 2)*y + pow(x, 2)*(y - 1) - 20, 2) + 3*pow(pi, 2)*pow(sin(pi*x), 2)*pow(cos(pi*y), 2) - 4000)*sin(pi*x)*sin(pi*y) - 1.0/832.0*pi*(48*pow(x, 2)*pow(y, 3) - 72*pow(x, 2)*pow(y, 2) + 24*pow(x, 2)*y - 160*pow(y, 2) + 160*y - pow(pi, 3)*sin(pi*(2*x - 2*y)) + pow(pi, 3)*sin(pi*(2*x + 2*y)) + 40*pow(pi, 2)*cos(pi*(x - y)) + 40*pow(pi, 2)*cos(pi*(x + y)))*sin(pi*x)*cos(pi*y) - 1.0/1664.0*pi*(112*pow(x, 4)*y - 56*pow(x, 4) + 96*pow(x, 2)*pow(y, 3) - 144*pow(x, 2)*pow(y, 2) + 48*pow(x, 2)*y - 1120*pow(x, 2) - 4*pow(pi, 3)*sin(2*pi*y) - 5*pow(pi, 3)*sin(pi*(2*x - 2*y)) + 5*pow(pi, 3)*sin(pi*(2*x + 2*y)) + 120*pow(pi, 2)*cos(pi*(x - y)) + 120*pow(pi, 2)*cos(pi*(x + y)))*sin(pi*x)*cos(pi*y)"
    - "(1.0/416.0)*pow(x, 2)*(12*pow(x, 2)*pow(y, 2)*pow(y - 1, 2) + 3*pow(pi*sin(pi*y)*cos(pi*x) + 20, 2) + 7*pow(pow(x, 2)*y + pow(x, 2)*(y - 1) - 20, 2) + 7*pow(pi, 2)*pow(sin(pi*x), 2)*pow(cos(pi*y), 2) - 4000) - 1.0/416.0*x*y*(y - 1)*(-48*pow(x, 3)*pow(y, 2) + 48*pow(x, 3)*y - 8*pow(x, 3) + 320*x*y - 160*x - pow(pi, 3)*sin(pi*(2*x - 2*y)) - pow(pi, 3)*sin(pi*(2*x + 2*y)) + 40*pow(pi, 2)*cos(pi*(x - y)) - 40*pow(pi, 2)*cos(pi*(x + y))) + (1.0/832.0)*x*y*(y - 1)*(96*pow(x, 3)*pow(y, 2) - 96*pow(x, 3)*y + 24*pow(x, 3) + 112*x*pow(y, 4) - 224*x*pow(y, 3) + 112*x*pow(y, 2) - 960*x*y + 480*x - 4*pow(pi, 3)*sin(2*pi*x) + 5*pow(pi, 3)*sin(pi*(2*x - 2*y)) + 5*pow(pi, 3)*sin(pi*(2*x + 2*y)) - 280*pow(pi, 2)*cos(pi*(x - y)) + 280*pow(pi, 2)*cos(pi*(x + y))) + (1.0/104.0)*x*y*(2*x*y*(y - 1)*(pow(x, 2)*y + pow(x, 2)*(y - 1) - 20) + pi*(pi*sin(pi*y)*cos(pi*x) + 20)*sin(pi*x)*cos(pi*y)) + (1.0/104.0)*x*(y - 1)*(2*x*y*(y - 1)*(pow(x, 2)*y + pow(x, 2)*(y - 1) - 20) + pi*(pi*sin(pi*y)*cos(pi*x) + 20)*sin(pi*x)*cos(pi*y)) + (1.0/104.0)*x*(2*y - 1)*(2*x*y*(y - 1)*(pow(x, 2)*y + pow(x, 2)*(y - 1) - 20) + pi*(pi*sin(pi*y)*cos(pi*x) + 20)*sin(pi*x)*cos(pi*y)) + (1.0/416.0)*y*(y - 1)*(28*pow(x, 2)*pow(y, 2)*pow(y - 1, 2) + 7*pow(pi*sin(pi*y)*cos(pi*x) + 20, 2) + 3*pow(pow(x, 2)*y + pow(x, 2)*(y - 1) - 20, 2) + 3*pow(pi, 2)*pow(sin(pi*x), 2)*pow(cos(pi*y), 2) - 4000) + (1.0/832.0)*(pow(x, 2)*y + pow(x, 2)*(y - 1) - 20)*(48*pow(x, 2)*pow(y, 3) - 72*pow(x, 2)*pow(y, 2) + 24*pow(x, 2)*y - 160*pow(y, 2) + 160*y - pow(pi, 3)*sin(pi*(2*x - 2*y)) + pow(pi, 3)*sin(pi*(2*x + 2*y)) + 40*pow(pi, 2)*cos(pi*(x - y)) + 40*pow(pi, 2)*cos(pi*(x + y))) + (1.0/1664.0)*(pow(x, 2)*y + pow(x, 2)*(y - 1) - 20)*(112*pow(x, 4)*y - 56*pow(x, 4) + 96*pow(x, 2)*pow(y, 3) - 144*pow(x, 2)*pow(y, 2) + 48*pow(x, 2)*y - 1120*pow(x, 2) - 4*pow(pi, 3)*sin(2*pi*y) - 5*pow(pi, 3)*sin(pi*(2*x - 2*y)) + 5*pow(pi, 3)*sin(pi*(2*x + 2*y)) + 120*pow(pi, 2)*cos(pi*(x - y)) + 120*pow(pi, 2)*cos(pi*(x + y)))"
solver:
  load_steps: 1
  newton: { rtol: 1e-11, atol: 1e-14, max_it: 25, print_level: 0 }
  linear: { type: gmres_amg, rtol: 1e-13, max_it: 1000 }
