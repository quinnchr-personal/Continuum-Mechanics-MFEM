# Cook's membrane, compressible plane-strain NeoHookean. Geometry (mm):
# corners (0,0), (48,44), (48,60), (0,44); left edge (left) clamped, uniform
# upward shear traction on the right edge (right). The traction of 3.75 per
# unit reference length (resultant 60) puts the top-right corner's vertical
# displacement at ~30% of the 16 mm edge (S4 calibration: 6.25 gave 47%).
mesh:
  file: apps/mesh/cook.msh        # 4 x 4 quadrilaterals of the membrane (apps/mesh/cook.geo); groups bottom, right, top, left
  serial_refine: 2
  parallel_refine: 0
  order: 2
material: { model: neo_hookean, E: 250.0, nu: 0.3, rho0: 1.0 }
bcs:
  dirichlet: [ { attr: [left], expression: ["0", "0"] } ]
  traction:  [ { attr: [right], expression: ["0", "3.75"] } ]
solver:
  load_steps: 1
  newton: { rtol: 1e-10, atol: 1e-12, max_it: 25 }
  linear: { type: gmres_amg, rtol: 1e-12, max_it: 500 }
output:
  paraview: out/cook/cook
  fields: [displacement, vonmises, jacobian]
  probes: [ { name: top_right_corner, point: [48.0, 60.0] } ]
