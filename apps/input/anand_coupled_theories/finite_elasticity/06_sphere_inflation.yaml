# Inflation of a sphere by internal pressure (solidmechanicscoupledtheories.github.io, 1. Finite Elasticity, 3D06): octant of a spherical
# shell with radii 10 and 11 mm, Arruda-Boyce; rollers on the three symmetry planes;
# follower pressure ramped to 35 kPa on the inner surface (the reference loses
# convergence near 34 kPa; a failed increment is bisected here). Tetrahedra with
# curved second-order geometry (apps/mesh/sphere_octant.geo, after spherical_shell.geo).
formulation: mixed
mesh: { file: apps/mesh/sphere_octant.msh, order: 2 }
material: { model: arruda_boyce, mu: 280.0, N: 26.2144, kappa: 280000.0, volumetric: logarithmic }   # kPa, mm: G0 = 280 kPa, lambda_L = 5.12 (N = lambda_L^2), K = 1000 G0, p = K ln J / J
bcs:
  dirichlet:
    - { attr: [xplane], expression: ["0", "0", "0"], components: [x] }
    - { attr: [yplane], expression: ["0", "0", "0"], components: [y] }
    - { attr: [zplane], expression: ["0", "0", "0"], components: [z] }
  traction:
    - { attr: [inner], type: follower_pressure, expression: "35" }
solver:
  predictor: tangent               # impose each Dirichlet increment on a linear solve about the converged state
  load_steps: 100
  substep: { on_failure: true, max_bisections: 6, min_dt: 1e-4 }
  newton: { rtol: 1e-8, atol: 1e-10, max_it: 30 }
  linear: { type: gmres_amg, rtol: 1e-10, max_it: 400, krylov_dim: 100, inner_rtol: 1e-4, inner_max_it: 200 }
output:
  paraview: out/anand_coupled_theories/finite_elasticity/06_sphere_inflation
  fields: [displacement, pressure, jacobian, vonmises, pk1_stress, cauchy_stress]
  probe_every_step: true            # the curves of the reference: probe values vs t
  reactions: true
  probes:
    - { name: inner, point: [10.0, 0.0, 0.0] }
    - { name: outer, point: [11.0, 0.0, 0.0] }
