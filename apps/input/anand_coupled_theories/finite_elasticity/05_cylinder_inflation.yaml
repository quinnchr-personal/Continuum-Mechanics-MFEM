# Inflation of a 3D cylinder by internal pressure (solidmechanicscoupledtheories.github.io, 1. Finite Elasticity, 3D05): quarter of a tube
# with inner radius 10 mm, wall 1 mm, length 5 mm, Arruda-Boyce; rollers on the planes
# x = 0, y = 0 and on both end faces (plane strain); follower pressure ramped to 50 kPa
# on the inner surface. The reference stops at 37.5 kPa when its Newton solver fails;
# here a failed increment is bisected (solver.substep). Tetrahedra with curved
# second-order geometry (apps/mesh/tube_quarter.geo, after cylinder_inflate.geo).
formulation: mixed
mesh: { file: apps/mesh/tube_quarter.msh, order: 2 }
material: { model: arruda_boyce, mu: 280.0, N: 26.2144, kappa: 280000.0, volumetric: logarithmic, inverse_langevin: pade }   # kPa, mm: G0 = 280 kPa, lambda_L = 5.12 (N = lambda_L^2), K = 1000 G0, p = K ln J / J
bcs:
  dirichlet:
    - { attr: [xplane], expression: ["0", "0", "0"], components: [x] }
    - { attr: [yplane], expression: ["0", "0", "0"], components: [y] }
    - { attr: [zbot, ztop], expression: ["0", "0", "0"], components: [z] }
  traction:
    - { attr: [inner], type: follower_pressure, expression: "50" }
solver:
  predictor: tangent               # impose each Dirichlet increment on a linear solve about the converged state
  load_steps: 100
  substep: { on_failure: true, max_bisections: 6, min_dt: 1e-4 }
  newton: { rtol: 1e-8, atol: 1e-10, max_it: 30 }
  linear: { type: direct }          # sparse LU (MUMPS through PETSc), as the reference; these problems are small enough to factor
output:
  paraview: out/anand_coupled_theories/finite_elasticity/05_cylinder_inflation
  fields: [displacement, pressure, jacobian, vonmises, pk1_stress, cauchy_stress]
  probe_every_step: true            # the curves of the reference: probe values vs t
  reactions: true
  probes:
    - { name: inner, point: [10.0, 0.0, 2.5] }
    - { name: outer, point: [11.0, 0.0, 2.5] }
