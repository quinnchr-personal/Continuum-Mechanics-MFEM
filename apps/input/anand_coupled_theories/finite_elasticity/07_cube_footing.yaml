# Cube under pressure on part of its face (solidmechanicscoupledtheories.github.io, 1. Finite Elasticity, 3D07): 50 mm cube (a quarter of a
# 100 mm block by symmetry), Arruda-Boyce; rollers on x = 0, y = 0, z = 0; the quarter
# patch x, y <= 25 of the top face carries a follower pressure ramped to 1500 kPa and
# is held in x and y (no sliding under the footing); the rest of the top and the
# faces x = 50, y = 50 are free. 100 steps; tetrahedra of size 5 (apps/mesh/footing.geo).
formulation: mixed
mesh: { file: apps/mesh/footing.msh, order: 2 }
material: { model: arruda_boyce, mu: 280.0, N: 26.2144, kappa: 280000.0, volumetric: logarithmic, inverse_langevin: pade }   # kPa, mm: G0 = 280 kPa, lambda_L = 5.12 (N = lambda_L^2), K = 1000 G0, p = K ln J / J
bcs:
  dirichlet:
    - { attr: [left],   expression: ["0", "0", "0"], components: [x] }
    - { attr: [front],  expression: ["0", "0", "0"], components: [y] }
    - { attr: [bottom], expression: ["0", "0", "0"], components: [z] }
    - { attr: [patch],  expression: ["0", "0", "0"], components: [x, y] }
  traction:
    - { attr: [patch], type: follower_pressure, expression: "1500" }
solver:
  predictor: tangent               # impose each Dirichlet increment on a linear solve about the converged state
  load_steps: 100
  substep: { on_failure: true, max_bisections: 6, min_dt: 1e-4 }
  newton: { rtol: 1e-8, atol: 1e-10, max_it: 30 }
  linear: { type: direct }          # sparse LU (MUMPS through PETSc), as the reference; these problems are small enough to factor
output:
  paraview: out/anand_coupled_theories/finite_elasticity/07_cube_footing
  fields: [displacement, pressure, jacobian, vonmises, pk1_stress, cauchy_stress]
  probe_every_step: true            # the curves of the reference: probe values vs t
  reactions: true
  probes:
    - { name: footing_center, point: [0.0, 0.0, 50.0] }
    - { name: patch_corner, point: [25.0, 25.0, 50.0] }
    - { name: free_corner, point: [50.0, 50.0, 50.0] }
