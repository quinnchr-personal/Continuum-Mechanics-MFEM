# Uniaxial tension of a cube with a spherical inclusion (solidmechanicscoupledtheories.github.io,
# 1. Finite Elasticity, 3D09): the reference's 10 mm cube with an eighth of a sphere of
# radius 5 mm at the corner (0, 0, 0), i.e. the octant of a 20 mm cube with a centred
# inclusion, both Arruda-Boyce with the inclusion ten times stiffer (G0 = 2800 kPa,
# K = 1000 G0) through material.regions. Rollers on x = 0, y = 0, z = 0; the face y = 10
# (back) moves by u_y = 10 t (stretch 2 over 50 steps), free in x and z; the other faces
# are free. Tetrahedra graded from 1 mm in the inclusion to 2.5 mm outside
# (apps/mesh/inclusion.geo). Probes: the reference's corner (10, 10, 10) and the
# interface pole (0, 5, 0) on the loading axis.
formulation: mixed
mesh: { file: apps/mesh/inclusion.msh, order: 2 }
material:
  model: arruda_boyce
  mu: 280.0                          # kPa, mm: matrix G0 = 280 kPa, lambda_L = 5.12, K = 1000 G0, p = K ln J / J
  N: 26.2144
  kappa: 280000.0
  volumetric: logarithmic          # the reference's law, p = K ln J / J
  regions:
    - { attr: [inclusion], mu: 2800.0, kappa: 2800000.0 }   # 10 G0, same lambda_L and K/G0
bcs:
  dirichlet:
    - { attr: [left],   expression: ["0", "0", "0"], components: [x] }
    - { attr: [front],  expression: ["0", "0", "0"], components: [y] }
    - { attr: [bottom], expression: ["0", "0", "0"], components: [z] }
    - { attr: [back], name: loaded,   expression: ["0", "10*t", "0"], components: [y] }   # stretch 2
solver:
  predictor: tangent               # impose each Dirichlet increment on a linear solve about the converged state
  load_steps: 50
  substep: { on_failure: true, max_bisections: 6, min_dt: 1e-4 }
  newton: { rtol: 1e-8, atol: 1e-10, max_it: 30 }
  linear: { type: gmres_amg, rtol: 1e-10, max_it: 400, krylov_dim: 100, inner_rtol: 1e-4, inner_max_it: 200 }
output:
  paraview: out/anand_coupled_theories/finite_elasticity/09_spherical_inclusion
  fields: [displacement, pressure, jacobian, vonmises, pk1_stress, cauchy_stress]
  probe_every_step: true
  reactions: true
  probes:
    - { name: corner, point: [10.0, 10.0, 10.0] }
    - { name: interface_pole, point: [0.0, 5.0, 0.0] }
    - { name: inclusion_center, point: [1.0, 1.0, 1.0] }
