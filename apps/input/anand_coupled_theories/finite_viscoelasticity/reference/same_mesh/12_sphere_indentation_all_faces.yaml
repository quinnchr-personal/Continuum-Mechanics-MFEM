# Same-mesh check with the reference's contact surface: the penalty acts on every boundary facet
# in the reference (its ds carries no tag), so on the symmetry planes x = 0 and y = 0 too, where the
# sphere reaches; the main input applies it to the top face only. Otherwise 12_sphere_indentation.yaml
# on the mesh of the reference's coarse notebook,
# dolfinx's create_box 10 x 10 x 6 of the 50 mm cube cut into tetrahedra (apps/mesh/indent_box_ref.msh,
# written by export_box.py 10 10 6 indent_box_ref.msh 50 50 50).
# Spherical indentation of an NBR block (solidmechanicscoupledtheories.github.io, 2. Finite
# Viscoelasticity, FV12): a rigid sphere of radius 10 mm on the axis of the corner x = y = 0 of the
# 50 mm cube's top face is pushed 10 mm into it in 60 s (50 steps of 1.2 s) and held for 400 s
# (10 steps of 40 s); the contact is the reference's penalty on the current position, energy
# k/2 <r^2 - |x - c|^2>_+^2 per unit reference area with k = 100 kPa/mm^3, on the top face.
# Rollers on x = 0, y = 0, z = 0 (the three symmetry planes of a sphere pressed into a large
# block: the cube is one octant of the problem) and the top face held in x and y, as the
# reference. The indenter force relaxes during the hold. Tetrahedra of apps/mesh/indent_cube.geo
# (after the reference's sphere_indent.geo: size 1 mm under the indenter, 10 mm elsewhere; the
# reference's coarse notebook uses a 10 x 10 x 6 box). Material as 08_cube_footing.yaml.
formulation: mixed
mesh: { file: apps/mesh/indent_box_ref.msh, order: 2 }   # left x=0, front y=0, bottom z=0, top z=50, right, back
material:
  model: arruda_boyce
  mu: 400.0
  N: 100.0
  kappa: 400000.0
  inverse_langevin: pade
  rho0: 1.3e-6
  branches:
    - { G: 535.7, tau: 1.0 }
    - { G: 76.20, tau: 10.0 }
    - { G: 120.5, tau: 100.0 }
    - { G: 21.3,  tau: 1000.0 }
    - { G: 22.9,  tau: 10000.0 }
time:
  t_final: 460.0
  steps: [ { to: 60.0, n: 50 }, { to: 460.0, n: 10 } ]
bcs:
  dirichlet:
    - { attr: [left],   expression: ["0", "0", "0"], components: [x] }
    - { attr: [front],  expression: ["0", "0", "0"], components: [y] }
    - { attr: [bottom], expression: ["0", "0", "0"], components: [z] }
    - { attr: [top], name: top, expression: ["0", "0", "0"], components: [x, y] }
  contact:
    - { attr: [top, left, front], name: indenter, type: rigid_sphere, radius: 10.0, penalty: 100.0,
        center: ["0", "0", "60 - 10*min(t/60, 1)"] }   # depth 10 t/60 mm until t = 60 s, then held
solver:
  substep: { on_failure: true, max_bisections: 6, min_dt: 1e-3 }
  newton: { rtol: 1e-8, atol: 1e-10, max_it: 30 }
  linear: { type: direct }
output:
  paraview: out/anand_coupled_theories/finite_viscoelasticity/same_mesh/12_sphere_indentation_all_faces
  fields: [displacement, pressure, jacobian, vonmises, pk1_stress, cauchy_stress]
  probe_every_step: true
  reactions: true
  probes:
    - { name: corner, point: [0.0, 0.0, 50.0] }
