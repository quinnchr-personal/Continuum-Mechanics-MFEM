# Visco-dynamic buckling of an NBR column (solidmechanicscoupledtheories.github.io, 2. Finite
# Viscoelasticity, FV11): the 1 x 1 x 20 mm column of the finite elasticity case 08 (first-mode
# imperfection of 0.005 mm) with the rubber's five Maxwell branches (tau_1 = 1 ms) and its
# inertia; the bottom clamped, the top held in x and y and shortened by 0.75 mm along a smooth
# step 3 s^2 - 2 s^3 (s = t / 0.02) over the first 20 ms, then held; 40 ms in 200 steps of 0.2 ms
# with the trapezoidal rule. The axial force rises to the buckling load and oscillates about the
# post-buckling force as the column snaps sideways and its vibration is damped. 4 x 4 x 50 Q2-Q1
# hexahedra (the reference's 4 x 4 x 50 box of tetrahedra). Material as 10_beam_impulse.yaml.
formulation: mixed
mesh: { file: apps/mesh/column_buckling50.msh, order: 2 }   # box.geo + perturb_column.py: bottom z=0, top z=20
material:
  model: arruda_boyce
  mu: 400.0
  N: 100.0
  kappa: 400000.0
  inverse_langevin: pade
  rho0: 1.3e-6
  branches:
    - { G: 535.7, tau: 1.0e-3 }
    - { G: 76.20, tau: 10.0 }
    - { G: 120.5, tau: 100.0 }
    - { G: 21.3,  tau: 1000.0 }
    - { G: 22.9,  tau: 10000.0 }
dynamics:
  t_final: 0.04
  dt: 0.0002
  scheme: newmark
bcs:
  dirichlet:
    - { attr: [bottom], name: bottom, expression: ["0", "0", "0"] }
    - { attr: [top], name: top, expression: ["0", "0", "-0.75*(3*min(t/0.02, 1)^2 - 2*min(t/0.02, 1)^3)"] }
solver:
  substep: { on_failure: true, max_bisections: 6, min_dt: 1e-7 }
  newton: { rtol: 1e-8, atol: 1e-12, max_it: 30 }
  linear: { type: direct }
output:
  paraview: out/anand_coupled_theories/finite_viscoelasticity/11_column_buckling
  fields: [displacement, velocity, pressure, vonmises, pk1_stress, cauchy_stress]
  every: 5
  probe_every_step: true
  reactions: true
  probes:
    - { name: mid_height, point: [0.5, 0.5, 10.0] }
    - { name: top_center, point: [0.5, 0.5, 20.0] }
