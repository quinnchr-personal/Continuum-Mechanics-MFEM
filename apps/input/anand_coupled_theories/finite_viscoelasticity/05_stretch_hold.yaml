# Stretch-and-hold of VHB 4910 (solidmechanicscoupledtheories.github.io, 2. Finite
# Viscoelasticity, FV05): the cube of 01 stretched in four 5 s ramps to the stretches 1.25, 1.5,
# 1.75 and 2, each held for 100 s, then unloaded the same way (840 s, 2000 steps of 0.42 s); the
# stress relaxes towards the equilibrium curve of 01 during every hold, from above on loading and
# from below on unloading. The table schedule is the reference's (times, amps) signal.
# Everything else as 01_uniaxial_equilibrium.yaml.
formulation: mixed
mesh: { file: apps/mesh/cube.msh, order: 2 }
material:
  model: arruda_boyce
  mu: 15.36
  N: 34.2225
  kappa: 15360.0
  inverse_langevin: pade
  rho0: 1.0e-6
  branches:
    - { G: 26.06, tau: 0.6074 }
    - { G: 26.53, tau: 6.56 }
    - { G: 10.83, tau: 61.25 }
time:
  t_final: 840.0
  dt: 0.42
bcs:
  dirichlet:
    - { attr: [left],   expression: ["0", "0", "0"], components: [x] }
    - { attr: [front],  expression: ["0", "0", "0"], components: [y] }
    - { attr: [bottom], expression: ["0", "0", "0"], components: [z] }
    - { attr: [back], name: loaded, expression: ["0", "1", "0"], components: [y],
        schedule: { type: table,
                    t: [0, 5, 105, 110, 210, 215, 315, 320, 420, 425, 525, 530, 630, 635, 735, 740, 840],
                    s: [0, 0.25, 0.25, 0.5, 0.5, 0.75, 0.75, 1.0, 1.0, 0.75, 0.75, 0.5, 0.5, 0.25, 0.25, 0, 0] } }
solver:
  substep: { on_failure: true, max_bisections: 6, min_dt: 1e-4 }
  newton: { rtol: 1e-8, atol: 1e-10, max_it: 30 }
  linear: { type: direct }
output:
  paraview: out/anand_coupled_theories/finite_viscoelasticity/05_stretch_hold
  fields: [displacement, pressure, jacobian, vonmises, pk1_stress, cauchy_stress]
  every: 10
  probe_every_step: true
  reactions: true
  probes:
    - { name: corner, point: [1.0, 1.0, 1.0] }
