# The uniaxial tension of uniaxial_neo_hookean.yaml as a symmetry model:
# the cube is the octant X, Y, Z >= 0 of a 2 x 2 x 2 block with rollers on the
# three symmetry planes (one component each) and the affine stretch on X = 1
# prescribed in x only; Y = 1 and Z = 1 are free. The exact solution is the
# same affine field u = ((lambda - 1) X, (lambda^-1/2 - 1) Y, (lambda^-1/2 - 1) Z)
# (it satisfies the roller conditions), so apps/homogeneous_compare.py checks
# the probed fields against the same closed form.
formulation: mixed
mesh:
  file: apps/mesh/cube.msh
  order: 2
material: { model: iso_neo_hookean, mu: 1.0, incompressible: true }
bcs:
  dirichlet:
    - { attr: [left],   value: [0.0, 0.0, 0.0], components: [x] }   # X = 0 symmetry plane
    - { attr: [front],  value: [0.0, 0.0, 0.0], components: [y] }   # Y = 0
    - { attr: [bottom], value: [0.0, 0.0, 0.0], components: [z] }   # Z = 0
    - { attr: [right], value: [0.0, 0.0, 0.0], components: [x],
        gradient: [[1, 0.0, 0.0], [0.0, -0.2928932188134525, 0.0], [0.0, 0.0, -0.2928932188134525]] }
solver:
  load_steps: 8
  newton: { rtol: 1e-11, atol: 1e-13, max_it: 30 }
  linear: { type: gmres_amg, rtol: 1e-13, max_it: 400, krylov_dim: 100, inner_rtol: 1e-4, inner_max_it: 100 }
output:
  paraview: out/homogeneous/symmetry_uniaxial_neo_hookean
  fields: [displacement, pressure, vonmises, jacobian, cauchy_stress, pk1_stress]
  quadrature_at: [nodes, elements]
  probes:
    - { name: corner, point: [1.0, 1.0, 1.0] }
    - { name: center, point: [0.5, 0.5, 0.5] }
