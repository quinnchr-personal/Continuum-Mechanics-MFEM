# Homogeneous equibiaxial tension to lambda = 1.5, incompressible Ogden, three-term Treloar fit (MPa),
# mixed u-p formulation (Taylor-Hood Q2-Q1) on the unit cube. The affine
# displacement u = ((lambda - 1) X, (lambda - 1) Y, (lambda^-2 - 1) Z) is
# prescribed on the four faces X = 0, 1 and Y = 0, 1; the faces Z = 0, 1 are
# free, so sigma_33 = 0 and sigma_11 = sigma_22 = 2 (lambda^2 - lambda^-4) (Psi_1 + lambda^2 Psi_2)
# (doc/incompressible_hyperelasticity.tex, Sec. 4.2); apps/homogeneous_compare.py
# checks the probed fields against it.
formulation: mixed
mesh:
  file: apps/mesh/cube.msh        # unit cube, 2 x 2 x 2 hexahedra; physical groups bottom, front, right, back, left, top
  order: 2
material: { model: ogden, mu_r: [0.63, 0.0012, -0.01], alpha_r: [1.3, 5.0, -2.0], incompressible: true }
bcs:
  dirichlet:
    - { attr: [left, right, front, back], value: [0.0, 0.0, 0.0], gradient: [[0.5, 0.0, 0.0], [0.0, 0.5, 0.0], [0.0, 0.0, -0.5555555555555556]] }
solver:
  load_steps: 8
  newton: { rtol: 1e-11, atol: 1e-13, max_it: 30 }
  linear: { type: gmres_amg, rtol: 1e-13, max_it: 400, krylov_dim: 100, inner_rtol: 1e-4, inner_max_it: 100 }
output:
  paraview: out/homogeneous/equibiaxial_ogden
  fields: [displacement, pressure, vonmises, jacobian, cauchy_stress, pk1_stress]
  quadrature_at: [nodes, elements]
  probes:
    - { name: corner, point: [1.0, 1.0, 1.0] }
    - { name: center, point: [0.5, 0.5, 0.5] }
