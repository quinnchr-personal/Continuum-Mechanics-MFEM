# Smoke input: unit square, p = 2, zero displacement field written to ParaView.
mesh:
  file: apps/mesh/square.msh      # 4 x 4 quadrilaterals, refined twice below
  serial_refine: 2
  parallel_refine: 0
  order: 2
material: { model: neo_hookean, E: 250.0, nu: 0.3, rho0: 1.0 }
bcs:
  dirichlet: [ { attr: [left], expression: ["0", "0"] } ]
  traction:  [ { attr: [right], expression: ["0", "1"] } ]
solver:
  load_steps: 1
  newton: { rtol: 1e-10, atol: 1e-12, max_it: 25 }
  linear: { type: gmres_amg, rtol: 1e-12, max_it: 500 }
output: { paraview: out/square, fields: [displacement] }
