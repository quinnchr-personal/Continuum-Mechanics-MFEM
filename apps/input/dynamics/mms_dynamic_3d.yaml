# Manufactured solution of linear elastodynamics on the unit cube (hexahedra):
# linear_elastic with E = 250, nu = 0.3, rho0 = 2.5 and the exact displacement
#   u(X, t) = sin(w t) U(X),   w = 20,
#   U = 0.05 (sin(pi x) sin(pi y) sin(pi z), x^2 y (1 - y) z, x z (1 - z) cos(pi y / 2)),
# prescribed on the whole boundary. U and its static body force b_s = -Div sigma(U) / rho0 are
# those of linear_elasticity/verification/manufactured_solutions/mms_3d_hex; per unit mass
#   b = u_tt - Div sigma(u) / rho0 = sin(w t) (b_s - w^2 U).
# Initial state u_0 = 0, v_0 = w U. See mms_dynamic_2d.yaml.
# tests/test_dynamic_verification.cpp checks third-order L2 convergence in h (serial_refine 0, 1, 2).
mesh: { file: apps/mesh/cube.msh, serial_refine: 1, order: 2 }
material: { model: linear_elastic, E: 250.0, nu: 0.3, rho0: 2.5 }
bcs:
  dirichlet:
    - attr: [bottom, front, right, back, left, top]
      expression: ["0.05*sin(pi*x)*sin(pi*y)*sin(pi*z)*sin(20*t)",
                   "0.05*x^2*y*(1 - y)*z*sin(20*t)",
                   "0.05*x*z*(1 - z)*cos(pi*y/2)*sin(20*t)"]
body_force:
  expression:
    - "sin(20*t)*((250.0/13.0)*x*y*z - 125.0/13.0*x*z + (125.0/13.0)*z*cos((1.0/2.0)*pi*y) + (275.0/26.0)*pow(pi, 2)*sin(pi*x)*sin(pi*y)*sin(pi*z) - 125.0/26.0*cos((1.0/2.0)*pi*y) - 400*0.05*sin(pi*x)*sin(pi*y)*sin(pi*z))"
    - "sin(20*t)*((175.0/13.0)*pow(x, 2)*z - 125.0/26.0*pi*x*z*sin((1.0/2.0)*pi*y) + (125.0/52.0)*pi*x*sin((1.0/2.0)*pi*y) + (50.0/13.0)*pow(y, 2)*z - 50.0/13.0*y*z - 125.0/26.0*pow(pi, 2)*sin(pi*z)*cos(pi*x)*cos(pi*y) - 400*0.05*x^2*y*(1 - y)*z)"
    - "sin(20*t)*((125.0/13.0)*pow(x, 2)*y - 125.0/26.0*pow(x, 2) - 25.0/52.0*pow(pi, 2)*x*pow(z, 2)*cos((1.0/2.0)*pi*y) + (25.0/52.0)*pow(pi, 2)*x*z*cos((1.0/2.0)*pi*y) + (175.0/13.0)*x*cos((1.0/2.0)*pi*y) - 125.0/26.0*pow(pi, 2)*sin(pi*y)*cos(pi*x)*cos(pi*z) - 400*0.05*x*z*(1 - z)*cos(pi*y/2))"
dynamics:
  t_final: 0.05
  dt: 0.0005
  scheme: newmark
  initial:
    velocity: ["20*0.05*sin(pi*x)*sin(pi*y)*sin(pi*z)",
               "20*0.05*x^2*y*(1 - y)*z",
               "20*0.05*x*z*(1 - z)*cos(pi*y/2)"]
solver:
  newton: { rtol: 1e-8, atol: 1e-16, max_it: 5, print_level: 0 }
  linear: { type: cg_amg, amg: systems, rtol: 1e-13, max_it: 1000 }
