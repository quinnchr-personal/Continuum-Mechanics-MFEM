# First bending frequency of a cantilever. L = 10, square section 1 x 1, clamped at x = 0 (left),
# linear_elastic with E = 250, nu = 0.3, rho0 = 2.5: the beam of
# linear_elasticity/verification/euler_bernoulli_cantilever3d. Euler-Bernoulli,
#   w_1 = 1.875104^2 sqrt(E I / (rho0 A L^4)) = 0.101500,   period 61.90,
# with I = 1/12, A = 1; shear deformation and rotary inertia (Timoshenko) lower it by about one
# percent at this slenderness of 10. A half-sine pulse of the tip shear traction, half a period
# long so that it feeds the first mode and little else, is followed by three periods of free
# vibration; the frequency is read from the zero crossings of the tip deflection. 124 steps per
# period: the period elongation of the scheme is 2e-4. generalized-alpha with rho_inf = 0.9
# takes out what the pulse puts into modes that the step does not resolve.
# tests/test_dynamic_verification.cpp checks the frequency; apps/dynamics_compare.py plots the history.
# Run from the repository root:  build/apps/solid_mechanics -i apps/input/dynamics/cantilever_vibration.yaml
mesh:
  file: apps/mesh/beam.msh        # 10 x 1 x 1, 20 x 2 x 2 hexahedra (apps/mesh/box.geo)
  order: 2
material: { model: linear_elastic, E: 250.0, nu: 0.3, rho0: 2.5 }
bcs:
  dirichlet: [ { attr: [left], name: clamp, expression: ["0", "0", "0"] } ]
  traction:  [ { attr: [right], name: pulse, expression: ["0", "0", "if(t < 30, -0.002*sin(pi*t/30), 0)"] } ]
dynamics:
  t_final: 220.0
  dt: 0.5
  scheme: generalized_alpha
  rho_inf: 0.9
solver:
  newton: { rtol: 1e-8, atol: 1e-16, max_it: 5, print_level: 0 }
  linear: { type: cg_amg, amg: systems, rtol: 1e-13, max_it: 1000 }
output:
  paraview: out/dynamics/cantilever_vibration
  fields: [displacement, velocity]
  every: 4
  probes: [ { name: tip, point: [10.0, 0.5, 0.5] } ]
  probe_every_step: true
  energy: true
