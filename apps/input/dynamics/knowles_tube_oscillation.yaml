# Radial oscillation of an incompressible tube: Knowles' exact reduction of finite-amplitude
# elastodynamics to one ordinary differential equation, and the dynamic check of the mixed u-p
# formulation. Plane strain, quarter of the annulus A = 1 <= R <= B = 2 with rollers on the two
# symmetry planes, traction-free inside and outside, incompressible iso_neo_hookean with mu = 1,
# rho0 = 1. Incompressibility leaves one degree of freedom, r^2 = R^2 + c(t), and the radial
# momentum balance integrated through the wall gives (doc/verification_manual.tex)
#   rho0 [ (c'' / 2) ln(b / a) - (c'^2 / 8) (1/a^2 - 1/b^2) ]
#       = - (mu / 2) [ ln(B^2 a^2 / (A^2 b^2)) + c (1/a^2 - 1/b^2) ],   a^2 = A^2 + c,  b^2 = B^2 + c.
# The tube starts undeformed with the isochoric radial velocity v_0 = k X / |X|^2, k = c'(0) / 2
# = 0.4: the inner radius swings between 0.91 and 1.28 with the period 4.24 (small oscillations
# would have 2 pi / sqrt(2 mu (1/A^2 - 1/B^2) / (rho0 ln(B/A))) = 4.27). The pressure follows
# from the same balance integrated to a radius r inside the wall,
#   sigma_rr(r) = rho0 [ (c'' / 2) ln(r / a) + (c'^2 / 8) (1/r^2 - 1/a^2) ]
#                 + (mu / 2) [ ln((r^2 - c) a^2 / (r^2 A^2)) - c / r^2 + c / a^2 ],
#   p = sigma_rr - mu dev(B)_rr,   dev(B)_rr = (2 R^2/r^2 - r^2/R^2 - 1) / 3,
# and at mid-wall it is carried by the inertia of the material inside it. apps/dynamics_compare.py
# integrates the equation with scipy and draws the inner radius and that pressure over it;
# tests/test_dynamic_verification.cpp integrates it with a Runge-Kutta scheme of its own.
# The pressure carries no inertia: a differential-algebraic system. With interpolated forces an
# error in the pressure returns with the factor -rho_inf per step, so a dissipative scheme is
# required here (rho_inf = 0.8), and the pressure of the first few steps is of no value: the
# initial pressure is taken as zero, whereas the accelerating wall needs p(R, 0) /= 0.
# Run from the repository root:  build/apps/solid_mechanics -i apps/input/dynamics/knowles_tube_oscillation.yaml
formulation: mixed
mesh:
  file: apps/mesh/annulus.msh     # quarter annulus, 4 x 8 quadrilaterals with second-order arcs
  serial_refine: 1
  order: 2
material: { model: iso_neo_hookean, mu: 1.0, incompressible: true, rho0: 1.0 }
bcs:
  dirichlet:
    - { attr: [bottom], name: bottom, expression: ["0", "0"], components: [y] }
    - { attr: [left], name: left, expression: ["0", "0"], components: [x] }
dynamics:
  t_final: 9.0                    # about two periods
  dt: 0.02
  scheme: generalized_alpha
  rho_inf: 0.8
  initial:
    velocity: ["0.4*x/(x^2 + y^2)", "0.4*y/(x^2 + y^2)"]
solver:
  newton: { rtol: 1e-10, atol: 1e-13, max_it: 30, print_level: 0 }
  linear: { type: gmres_amg, rtol: 1e-12, max_it: 400, krylov_dim: 100, inner_rtol: 1e-4, inner_max_it: 100 }
output:
  paraview: out/dynamics/knowles_tube_oscillation
  fields: [displacement, velocity, pressure, jacobian]
  every: 5
  probes: [ { name: inner, point: [1.0, 0.0] }, { name: mid, point: [1.5, 0.0] }, { name: outer, point: [2.0, 0.0] } ]
  probe_every_step: true
  energy: true
