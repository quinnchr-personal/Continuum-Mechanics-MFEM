# Manufactured solution of small-strain linear elasticity on the unit cube: linear_elastic with
# E = 250, nu = 0.3 (mu = 1250/13, lambda = 1875/13), rho0 = 2.5, exact displacement
#   u = 0.05 (sin(pi x) sin(pi y) sin(pi z), x^2 y (1 - y) z, x z (1 - z) cos(pi y / 2))
# prescribed on the whole boundary, body force
#   rho0 b = -Div sigma = -[(lambda + mu) grad(div u) + mu lap(u)]
# (generated with sympy and checked against that identity). Tetrahedra (apps/mesh/cube_tet.msh refined);
# same displacement as finite_elasticity/verification/manufactured_solutions/mms_3d_tet.
# One Newton iteration per mesh; tests/test_linear_verification.cpp checks third-order L2
# convergence for p = 2.
mesh: { file: apps/mesh/cube_tet.msh, serial_refine: 1, order: 2 }
material: { model: linear_elastic, E: 250.0, nu: 0.3, rho0: 2.5 }
bcs:
  dirichlet:
    - { attr: [bottom, front, right, back, left, top], expression: ["0.05*sin(pi*x)*sin(pi*y)*sin(pi*z)", "0.05*x^2*y*(1 - y)*z", "0.05*x*z*(1 - z)*cos(pi*y/2)"] }
body_force:
  expression:
    - "(250.0/13.0)*x*y*z - 125.0/13.0*x*z + (125.0/13.0)*z*cos((1.0/2.0)*pi*y) + (275.0/26.0)*pow(pi, 2)*sin(pi*x)*sin(pi*y)*sin(pi*z) - 125.0/26.0*cos((1.0/2.0)*pi*y)"
    - "(175.0/13.0)*pow(x, 2)*z - 125.0/26.0*pi*x*z*sin((1.0/2.0)*pi*y) + (125.0/52.0)*pi*x*sin((1.0/2.0)*pi*y) + (50.0/13.0)*pow(y, 2)*z - 50.0/13.0*y*z - 125.0/26.0*pow(pi, 2)*sin(pi*z)*cos(pi*x)*cos(pi*y)"
    - "(125.0/13.0)*pow(x, 2)*y - 125.0/26.0*pow(x, 2) - 25.0/52.0*pow(pi, 2)*x*pow(z, 2)*cos((1.0/2.0)*pi*y) + (25.0/52.0)*pow(pi, 2)*x*z*cos((1.0/2.0)*pi*y) + (175.0/13.0)*x*cos((1.0/2.0)*pi*y) - 125.0/26.0*pow(pi, 2)*sin(pi*y)*cos(pi*x)*cos(pi*z)"
solver:
  load_steps: 1
  newton: { rtol: 1e-8, atol: 1e-14, max_it: 5, print_level: 0 }
  linear: { type: cg_amg, rtol: 1e-13, max_it: 1000 }
