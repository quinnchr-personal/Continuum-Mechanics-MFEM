# Mach 4.5 / Re=1000 sanity run on the Exasim mesh from a damped-freestream
# initial condition with PTC: exercises the Armijo line search, PTC/SER, and
# the tanh artificial-viscosity path end to end.
case_name: m45_sanity

mesh:
  source: exasim
  exasim_dir: /home/quinnchr/dv/Exasim-apps/runs/nsmach8-baseline

bc:
  - {attrs: [1], type: isothermal_wall}
  - {attrs: [2], type: supersonic_outflow}
  - {attrs: [3], type: freestream}

physics:
  model: perfect_gas
  gamma: 1.4
  reynolds: 1000.0
  prandtl: 0.71
  mach: 4.5
  T_inf_K: 124.49
  Twall_K: 294.44
  tau: 1.0

av:
  mode: tanh
  lambda: 0.05
  c: 5.0

init:
  mode: damped_freestream
  c: 10.0

newton:
  max_iters: 80
  tol: 1.0e-6

ptc:
  enabled: true
  initial_dt: 1.5e1

linear:
  type: petsc_direct

output:
  path: ParaView/m45_sanity
  paraview_every: 0
