# Mach 3 / Re=1000 cylinder from a mesh FILE (the G3 file-input path):
# same physics pipeline as the M4.5 sanity run, but the mesh is read from
# an MFEM mesh file written by tools/generate_cylinder_mesh.
case_name: m30_cylinder_file

mesh:
  source: file
  file: input/cylinder_nr6_nc12_q4.mesh

bc:
  - {attrs: [1], type: isothermal_wall}
  - {attrs: [2], type: supersonic_outflow}
  - {attrs: [3], type: freestream}

physics:
  model: perfect_gas
  gamma: 1.4
  reynolds: 1000.0
  prandtl: 0.71
  mach: 3.0
  T_inf_K: 124.49
  Twall_K: 294.44
  tau: 1.0

discretization:
  order: 4

av:
  mode: tanh
  lambda: 0.05
  c: 5.0

init:
  mode: damped_freestream
  c: 10.0

newton:
  max_iters: 80
  tol: 1.0e-6

ptc:
  enabled: true
  initial_dt: 1.5e1

linear:
  type: petsc_direct

output:
  path: ParaView/m30_cylinder_file
  paraview_every: 0
