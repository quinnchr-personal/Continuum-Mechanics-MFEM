# Frozen-replica regression: the Mach 8.03 half-cylinder case on the Exasim
# mesh, initialized from the converged Exasim state. Constants are derived at
# full precision (the frozen app used rounded deck literals), so wall
# quantities are gated loosely against the frozen app's committed CSV rather
# than to round-off.
case_name: mach8_regression

mesh:
  source: exasim
  exasim_dir: /home/quinnchr/dv/Exasim-apps/runs/nsmach8-baseline

bc:
  - {attrs: [1], type: isothermal_wall}
  - {attrs: [2], type: supersonic_outflow}
  - {attrs: [3], type: freestream}

physics:
  model: perfect_gas
  gamma: 1.4
  reynolds: 183500.0
  prandtl: 0.71
  mach: 8.03
  T_inf_K: 124.49
  Twall_K: 294.44
  tau: 1.0

av:
  mode: file

init:
  mode: udg_file

newton:
  max_iters: 30
  tol: 1.0e-6

ptc:
  enabled: false
  initial_dt: 1.0e-3

linear:
  type: petsc_direct

output:
  path: ParaView/mach8_regression
  wall_csv: wall_data.csv
  comparison_report: regression_report.md
  paraview_every: 0

comparison:
  reference_wall_csv: ../hdg_navierstokes/wall_data.csv
  reference_shock_standoff: 0.002002002002001957
  gate: true
  cp_tol: 1.0e-2
  heat_flux_tol: 2.0e-2
  shock_tol: 1.0e-2
